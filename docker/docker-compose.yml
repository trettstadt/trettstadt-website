version: "3.8"

services:
  caddy:
    image: caddy:alpine
    restart: always
    # Host networking so that Caddy sees the real IPv4 AND IPv6 client address. With published
    # ports, Docker's userland proxy hands IPv6 visitors to Caddy as the bridge gateway
    # (172.18.0.1), because Docker adds no IPv6 NAT rules on this host. Caddy therefore cannot use
    # Docker service names: the apps it serves itself are published on 127.0.0.1 below (ports
    # 18080-18083) and the Caddyfile points to those. See infrastructure/EXPENSE-SPLITTER-WIREGUARD.md.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  astro-site:
    image: ghcr.io/trettstadt/portfolio-astro:latest
    restart: always
    ports:
      - "127.0.0.1:18080:80"

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - /mnt/postgres:/var/lib/postgresql

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:18081:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      APP_BASE_URL: https://analytics.trettstadt.de

  calcom:
    build:
      context: .
      dockerfile: Dockerfile.calcom
    restart: always
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:18082:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_WEBAPP_URL: https://book.trettstadt.de
      NEXTAUTH_URL: https://book.trettstadt.de/api/auth
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      DATABASE_HOST: postgres:5432
      DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@postgres:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD}@postgres:5432/calcom
      EMAIL_SERVER_HOST: smtp.ionos.de
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: ${CALCOM_SMTP_USER}
      EMAIL_SERVER_PASSWORD: ${CALCOM_SMTP_PASSWORD}
      EMAIL_FROM: "Tobias Rettstadt <tobias@rettstadt.de>"
      EMAIL_FROM_NAME: "Tobias Rettstadt"

  jitsi-web:
    image: jitsi/web:stable
    restart: always
    depends_on:
      - jitsi-jvb
    ports:
      - "127.0.0.1:18083:80"
    environment:
      PUBLIC_URL: https://meet.trettstadt.de
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal.meet.jitsi
      XMPP_PORT: "5222"
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_PORT: "10000"
      ENABLE_COLIBRI_WEBSOCKET: "true"
      ENABLE_XMPP_WEBSOCKET: "true"
    networks:
      meet.jitsi:

  jitsi-prosody:
    image: jitsi/prosody:stable
    restart: always
    expose:
      - "5222"
      - "5347"
      - "5280"
    environment:
      PUBLIC_URL: https://meet.trettstadt.de
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal.meet.jitsi
      XMPP_PORT: "5222"
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_AUTH_USER: jvb
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    restart: always
    depends_on:
      - jitsi-prosody
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_PORT: "5222"
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JVB_BREWERY_MUC: jvbbrewery
    networks:
      meet.jitsi:

  jitsi-jvb:
    image: jitsi/jvb:stable
    restart: always
    ports:
      - "10000:10000/udp"
    depends_on:
      - jitsi-prosody
    environment:
      PUBLIC_URL: https://meet.trettstadt.de
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_PORT: "5222"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_PORT: "10000"
      JVB_BREWERY_MUC: jvbbrewery
      JVB_ADVERTISE_IPS: ${JITSI_PUBLIC_IP}
      DOCKER_HOST_ADDRESS: ${JITSI_PUBLIC_IP}
      ENABLE_COLIBRI_WEBSOCKET: "true"
    networks:
      meet.jitsi:

volumes:
  caddy_data:
  caddy_config:

networks:
  meet.jitsi:
